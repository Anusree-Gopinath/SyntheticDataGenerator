name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # scikit-learn for the embedding classifier's learned model; PyTorch-based tests
      # (CTGAN, TVAE) skip, keeping the job small
      - run: pip install -e ".[dev]" scikit-learn
      - run: ruff check synthgen tests
      # data/ is never committed: build the reference world and its stores first
      - run: python -m synthgen.reference_world.simulator --config config/reference_world.yaml
      - run: python -m synthgen.reference_world.stores --config config/reference_world.yaml
      - run: pytest -rs
