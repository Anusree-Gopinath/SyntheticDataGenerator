[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthgen"
version = "0.1.0"
description = "LLM-guided synthetic data generation for automated software testing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Anusree Gopinath" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.5"]
app = ["streamlit>=1.67"]  # step bar, theme font and layout features need 1.67+
embeddings = ["sentence-transformers>=3.0"]
deep = ["torch>=2.1", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
include = ["synthgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
